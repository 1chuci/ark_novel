name: Personal Android APK

on:
  push:
    branches: [codex/android-apk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build universal APK with bundled Cronet
        run: flutter build apk --release --dart-define=cronetHttpNoPlay=true --obfuscate --split-debug-info=build/symbols -t lib/next/main.dart

      - name: Publish personal prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create personal-v1.3.0+40
          build/app/outputs/flutter-apk/app-release.apk
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "Ark Novel 1.3.0+40 (个人构建)"
          --notes "个人维护构建；基于上游 ark_novel-v1.3.0（1.3.0+40）。包含 arm64、armeabi-v7a、x86_64，使用内置 Cronet。"
          --prerelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ark-novel-1.3.0-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: ark-novel-1.3.0-debug-symbols
          path: build/symbols/
          if-no-files-found: error
          retention-days: 7
